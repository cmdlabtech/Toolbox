; Copy this file to config.ini and fill in your credentials.
; config.ini is gitignored so credentials never leave your machine.
; Every value can also be supplied as an environment variable (shown in parens).

[greenlake]
; Create API client credentials in HPE GreenLake:
;   Workspace -> Manage Workspace -> API -> Create Credentials
client_id = your-greenlake-client-id            ; (GL_CLIENT_ID)
client_secret = your-greenlake-client-secret    ; (GL_CLIENT_SECRET)
; Defaults below rarely need changing
; sso_url = https://sso.common.cloud.hpe.com/as/token.oauth2
; api_base = https://global.api.greenlake.hpe.com

[central]
; Which Central runs your APs? (CENTRAL_MODE)
;   classic = Classic Aruba Central (login at central.arubanetworks.com)
;   new     = New Central, GreenLake-native (opened from the GreenLake portal)
mode = classic

; --- mode = new ---------------------------------------------------------
; base_url is your cluster, e.g. https://us1.api.central.arubanetworks.com
; Auth reuses the GreenLake credentials above automatically; only set
; client_id/client_secret below if you created a dedicated New Central
; API client instead.

; --- mode = classic -----------------------------------------------------
; base_url is your API gateway (region specific), e.g.
;   US-2: https://apigw-prod2.central.arubanetworks.com
;   EU-1: https://eu-apigw.central.arubanetworks.com
; Find yours in Central: Organization -> Platform Integration -> REST API
base_url = https://apigw-prod2.central.arubanetworks.com   ; (CENTRAL_BASE_URL)

; --- Classic authentication: pick ONE of the two options below ----------

; Option A (simplest): paste an access token generated in the Central UI
; (API Gateway -> System Apps & Tokens -> Generate Token). Valid ~2 hours.
; access_token =                                 ; (CENTRAL_ACCESS_TOKEN)

; Option B (recommended for repeat runs): OAuth app + refresh token.
; The tool refreshes automatically and stores rotated tokens in .central_token.json
; client_id =                                    ; (CENTRAL_CLIENT_ID)
; client_secret =                                ; (CENTRAL_CLIENT_SECRET)
; refresh_token =                                ; (CENTRAL_REFRESH_TOKEN)
